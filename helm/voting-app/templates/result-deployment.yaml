apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/drukpong/example-voting-app-result:ae02176318858bc8398429f7d12abd2c394718dc
        name: result
        ports:
        - containerPort: 8080
          name: result
