apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/drukpong/example-voting-app-worker:21c33acdf9e662a553709f736c24972c33300de0
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: voting-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voting-db-secret
                  key: POSTGRES_PASSWORD
