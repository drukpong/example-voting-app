name: Worker CI and Security

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/call-docker-build-worker.yaml'

  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/call-docker-build-worker.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    name: Build, Scan and Publish Worker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          load: true
          tags: example-voting-app-worker:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: example-voting-app-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/drukpong/example-voting-app-worker
          TAG: ${{ github.sha }}
        run: |
          docker tag "example-voting-app-worker:$TAG" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
