name: Vote CI and Security

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    name: Build, Scan and Publish Vote
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          target: final
          load: true
          tags: example-voting-app-vote:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: example-voting-app-vote:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/drukpong/example-voting-app-vote
          TAG: ${{ github.sha }}
        run: |
          docker tag "example-voting-app-vote:$TAG" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
